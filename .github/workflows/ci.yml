# 1. NAME
name: CI Tests

# 2. TRIGGER
on:
  workflow_dispatch:
  push:
    branches: [Master]
  issue_comment:
    types: [created]

# 3. JOBS
jobs:
  test:
    name: Run Automated Tests
    permissions:
      statuses: write
      pull-requests: read
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' && 
       github.event.comment.body == '/run-tests-ui' &&
       github.event.issue.pull_request)
    runs-on: ubuntu-latest

# 4. STEPS
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
          INVALID_USERNAME: ${{ secrets.INVALID_USERNAME }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pytest tests/ -v --headless --html=reports/report.html --self-contained-html

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: test-execution-report
            path: reports/
            retention-days: 7

      - name: Report status to PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const jobStatus = '${{ job.status }}';
            const state = jobStatus === 'success' ? 'success' : 'failure';
            
            let sha;
            if (context.eventName === 'issue_comment') {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number
              });
              sha = pr.data.head.sha;
            } else {
              sha = context.sha;
            }
              
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: state,
              context: 'Run Automated Tests',
              description: state === 'success' ? 'Tests passed' : 'Tests failed'
            });